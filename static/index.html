<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="N.E.O.N.">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>N.E.O.N. Tactical Protocol</title>
  <style>
    :root {
      --bg: #050a14;
      --panel: #0a1124;
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.15);
      --border: #13284c;
      --text: #cce3f5;
      --text-dim: #5d7a9e;
      --alert: #ffaa00;
      --red: #ff3366;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    
    /* Tactical Header & HUD */
    header {
      background: rgba(10, 17, 36, 0.9);
      backdrop-filter: blur(12px);
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
    .hud-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #10b981;
      font-weight: 600;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Chat Container */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #0d2847;
      border: 1px solid #1a4980;
      color: #e0f2fe;
      border-bottom-right-radius: 2px;
    }
    .msg.neon {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--cyan);
      border-bottom-left-radius: 2px;
      color: var(--text);
    }

    /* Action Authorization Box (HITL) */
    .permission-box {
      margin-top: 10px;
      background: rgba(255, 170, 0, 0.08);
      border: 1px solid var(--alert);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }
    .permission-box code {
      color: var(--cyan);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .auth-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-auth {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      border: none;
      letter-spacing: 0.5px;
    }
    .btn-auth.approve { background: #059669; color: white; }
    .btn-auth.deny { background: #991b1b; color: white; }

    /* Download Buttons */
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
    }

    /* Footer Input */
    footer {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: rgba(10, 17, 36, 0.95);
      display: flex;
      gap: 10px;
      border-top: 1px solid var(--border);
    }
    input {
      flex: 1;
      background: #070d1a;
      border: 1px solid var(--border);
      color: var(--cyan);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: var(--cyan); }
    button#send {
      background: var(--cyan);
      color: #050a14;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <header>
    <div class="hud-title">💠 N.E.O.N.</div>
    <div class="hud-status">
      <div class="status-dot"></div> CORE ONLINE
    </div>
  </header>

  <div id="chat-box">
    <div class="msg neon">N.E.O.N. core online. Tactical research systems initialized and awaiting directive.</div>
  </div>

  <footer>
    <input type="text" id="prompt-input" placeholder="Input command or directive..." autocomplete="off">
    <button id="send" onclick="sendPrompt()">RUN</button>
  </footer>

  <script>
    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt-input");
    let audioPlayer = new Audio();

    function unlockAudio() {
      audioPlayer.play().catch(() => {});
      document.removeEventListener("touchstart", unlockAudio);
      document.removeEventListener("click", unlockAudio);
    }
    document.addEventListener("touchstart", unlockAudio, { once: true });
    document.addEventListener("click", unlockAudio, { once: true });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendPrompt();
    });

    function playAudioB64(b64) {
      if (!b64) return;
      audioPlayer.src = "data:audio/mp3;base64," + b64;
      audioPlayer.play().catch(e => console.warn("Audio playback failed:", e));
    }

    function appendMessage(html, sender) {
      const msg = document.createElement("div");
      msg.className = `msg ${sender}`;
      msg.innerHTML = html.replace(/\n/g, '<br>');
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msg;
    }

    function removeAuthCard() {
      const card = document.getElementById("auth-card");
      if (card) {
        const parentMsg = card.closest(".msg");
        if (parentMsg) parentMsg.remove();
        else card.remove();
      }
    }

    async function sendPrompt() {
      const text = promptInput.value.trim();
      if (!text) return;

      audioPlayer.load();
      appendMessage(text, "user");
      promptInput.value = "";
      const loading = appendMessage("Processing tactical directive...", "neon");

      try {
        const res = await fetch("/api/task", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: text, history: [] })
        });
        const data = await res.json();
        loading.remove();

        if (data.status === "requires_permission") {
          removeAuthCard();

          const authHtml = `
            <div id="auth-card" class="permission-box">
              ⚠️ <strong>SECURITY AUTHORIZATION REQUIRED</strong><br><br>
              Action: <code>${data.tool_name}</code><br>
              Parameters: <code>${JSON.stringify(data.tool_args)}</code>
              <div class="auth-actions">
                <button class="btn-auth approve" onclick="authorizeAction('${data.tool_name}', ${JSON.stringify(data.tool_args).replace(/"/g, '&quot;')})">✅ Authorize Action</button>
                <button class="btn-auth deny" onclick="denyAction('${data.tool_name}')">❌ Deny Action</button>
              </div>
            </div>
          `;
          appendMessage(authHtml, "neon");
          return;
        }

        let replyHtml = data.text || "Directive executed successfully.";
        if (data.download_url) {
          replyHtml += `<br><a class="download-btn" href="${data.download_url}">📥 Download ${data.filename}</a>`;
        }
        appendMessage(replyHtml, "neon");

        if (data.audio_b64) {
          playAudioB64(data.audio_b64);
        }

      } catch (err) {
        loading.innerHTML = `<span style="color: var(--red);">Communication Error: ${err.message}</span>`;
      }
    }

    async function authorizeAction(tool_name, tool_args) {
      removeAuthCard();

      const loading = appendMessage("Executing authorized protocol...", "neon");
      try {
        const res = await fetch("/api/execute-action", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ tool_name, tool_args })
        });
        const data = await res.json();
        loading.remove();
        appendMessage(`Action executed: <code>${data.tool_name}</code><br>Result: ${data.result}`, "neon");
      } catch (err) {
        loading.innerHTML = `<span style="color: var(--red);">Execution Error: ${err.message}</span>`;
      }
    }

    function denyAction(tool_name) {
      removeAuthCard();
      appendMessage(`Action <code>${tool_name}</code> was cancelled by user.`, "neon");
    }
  </script>
</body>
</html>
