<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dropSand {
      0% {
        cy: 40px;
        opacity: 0;
        r: 1.5px;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        cy: 102px;
        opacity: 0;
        r: 2.2px;
      }
    }

    @keyframes flipCycle {
      0%, 75% {
        transform: rotate(0deg);
      }
      85%, 100% {
        transform: rotate(180deg);
      }
    }

    .hourglass-root {
      transform-origin: 50px 60px;
      animation: flipCycle 4.5s infinite cubic-bezier(0.65, 0, 0.35, 1);
    }

    .frame {
      fill: none;
      stroke: #00f3ff;
      stroke-width: 3.5;
      stroke-linejoin: round;
      filter: url(#neon-glow);
    }

    .sand-pile-top {
      fill: #00f3ff;
      opacity: 0.55;
      filter: url(#neon-glow);
    }

    .sand-pile-bottom {
      fill: #00f3ff;
      opacity: 0.75;
      filter: url(#neon-glow);
    }

    .particle {
      fill: #00f3ff;
      filter: url(#neon-glow);
      animation: dropSand 1.2s infinite cubic-bezier(0.4, 0, 1, 1);
    }

    .p1 { animation-delay: 0.0s; }
    .p2 { animation-delay: 0.3s; }
    .p3 { animation-delay: 0.6s; }
    .p4 { animation-delay: 0.9s; }
  </style>

  <rect width="100" height="120" fill="#050a14"/>

  <g class="hourglass-root">
    <polygon class="frame" points="15,12 85,12 50,60 85,108 15,108 50,60" />
    <polygon class="sand-pile-top" points="26,24 74,24 50,56" />
    <polygon class="sand-pile-bottom" points="28,104 72,104 60,88 40,88" />
    <circle class="particle p1" cx="50" cy="60" r="2" />
    <circle class="particle p2" cx="49" cy="60" r="1.8" />
    <circle class="particle p3" cx="51" cy="60" r="2.2" />
    <circle class="particle p4" cx="50" cy="60" r="1.7" />
  </g>
</svg>
